[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobintel"
version = "0.1.0"
description = "Job Market Intelligence Platform: UK entry-level data job postings"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "pandas>=2.2", "altair>=5"]
dbt = ["dbt-core>=1.10,<2", "dbt-postgres>=1.9,<2"]
dev = ["pytest>=8", "ruff>=0.6", "jobintel[dashboard,dbt]"]

[project.scripts]
jobintel = "jobintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests that need a PostgreSQL database (DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Local deployment.
#   docker compose up -d postgres        database only (for running jobintel on the host)
#   docker compose up -d --build         database + Airflow (daily DAG) + dashboard
#   docker compose run --rm cli demo     one-off jobintel commands inside the image
# Airflow UI: http://localhost:8080   Dashboard: http://localhost:8501  (bound to this machine only)

x-jobintel: &jobintel
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: jobintel:local
  # The repository is mounted over the image copy: code, config, dbt and data/raw are the
  # host's. Settings come from .env; DATABASE_URL is overridden to reach the postgres service.
  volumes:
    - .:/opt/jobintel
  env_file: .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-jobintel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobintel}
  # On Linux, set AIRFLOW_UID=$(id -u) in .env so files written to data/raw belong to you.
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobintel}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    <<: *jobintel
    entrypoint: ["bash", "/opt/jobintel/docker/airflow-start.sh"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobintel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobintel}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-jobintel}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/jobintel/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # Local, single-user deployment: the UI is only reachable from this machine
      # (port bound to 127.0.0.1), so it runs without a login.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/opt/jobintel
      - airflow-home:/opt/airflow
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  dashboard:
    <<: *jobintel
    entrypoint: ["/opt/jobintel-venv/bin/jobintel"]
    command: ["dashboard", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  # One-off commands: docker compose run --rm cli <jobintel args>
  cli:
    <<: *jobintel
    entrypoint: ["/opt/jobintel-venv/bin/jobintel"]
    command: ["--help"]
    profiles: ["tools"]

volumes:
  pgdata:
  airflow-home:

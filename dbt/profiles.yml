# Connection comes from environment variables (no secrets in the repo).
# `jobintel transform` sets them from DATABASE_URL in .env.
jobintel:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5433') | int }}"
      user: "{{ env_var('DBT_USER', 'jobintel') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'jobintel') }}"
      schema: analytics
      threads: 4
